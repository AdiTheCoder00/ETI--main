<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ETI Drone Visuals, share image</title>
<!-- Source for app/opengraph-image.jpg (1200x630). Re-render with headless Edge after editing. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Poppins:wght@500&display=block" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;background:#16150F;overflow:hidden}
  body{display:grid;grid-template-columns:600px 1fr;font-family:'Archivo',sans-serif;color:#EEEAE1}
  .text{display:flex;flex-direction:column;justify-content:space-between;padding:56px 0 52px 64px}
  .brand{display:flex;align-items:center;gap:14px}
  .brand svg{width:46px;height:46px}
  .brand b{font-size:40px;font-weight:800;font-stretch:75%;letter-spacing:-.03em}
  .brand span{font-size:22px;font-weight:500;letter-spacing:-.03em}
  h1{font-size:74px;font-weight:800;font-stretch:72%;text-transform:uppercase;line-height:.92;letter-spacing:-.005em;text-wrap:balance}
  .foot{font-family:'Poppins',sans-serif;font-weight:500;font-size:19px;color:#A8A395}
  .foot b{color:#E0622A;font-weight:500}
  .media{position:relative;margin:40px 40px 40px 0;background:url(../assets/work/plant-fpv.jpg) 38% center/cover}
  .media svg{position:absolute;inset:26px;width:calc(100% - 52px);height:calc(100% - 52px)}
</style>
</head>
<body>
  <div class="text">
    <div class="brand">
      <svg viewBox="0 0 100 100"><path d="M8 31V8h23M69 8h23v23M92 69v23H69M31 92H8V69" fill="none" stroke="#EEEAE1" stroke-width="7.5" stroke-linecap="square"/><circle cx="50" cy="50" r="21" fill="none" stroke="#EEEAE1" stroke-width="7.5"/><circle cx="50" cy="50" r="7" fill="#E0622A"/></svg>
      <b>ETI</b><span>Drone Visuals</span>
    </div>
    <h1>We fly cameras where cranes and helicopters can’t go.</h1>
    <p class="foot">Aerial film, inspection and survey <b>·</b> Mumbai</p>
  </div>
  <div class="media">
    <!-- viewfinder corners only, stretched to the frame, so the footage reads through the mark's language -->
    <svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 14V0h14M86 0h14v14M100 86v14H86M14 100H0V86" fill="none" stroke="#F1EEE7" stroke-width="1.6" vector-effect="non-scaling-stroke" style="stroke-width:5px"/></svg>
  </div>
</body>
</html>
